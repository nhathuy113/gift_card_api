# Omakase Ruby styling for Rails
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

# Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: no_space

# Omakase disables the Lint department. Keep this cop on so a debugger call fails CI.
Lint/Debugger:
  Enabled: true

# Omakase only checks app, config, lib, test, and the Gemfile.
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes
  Include:
    - "app/**/*"
    - "config/**/*"
    - "lib/**/*"
    - "test/**/*"
    - "spec/**/*"
    - "Gemfile"
