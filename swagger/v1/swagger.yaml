openapi: 3.0.3
info:
  title: Gift card API
  version: v1
  description: Users log in. An admin creates clients, brands, and products.
servers:
  - url: /
paths:
  /api/v1/login:
    post:
      summary: Log in
      tags: [Login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Token and the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Login"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/logout:
    post:
      summary: Log out
      tags: [Login]
      security:
        - bearer: []
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/admin/clients:
    post:
      summary: Create a client
      tags: [Admin]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, payout_rate]
              properties:
                email:
                  type: string
                password:
                  type: string
                payout_rate:
                  type: number
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Validation"
  /api/v1/admin/clients/{id}/state:
    patch:
      summary: Change client state
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateInput"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/admin/brands:
    get:
      summary: List brands
      tags: [Admin]
      security:
        - bearer: []
      responses:
        "200":
          description: Brands ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a brand
      tags: [Admin]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Validation"
  /api/v1/admin/brands/{id}:
    get:
      summary: Show a brand
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a brand
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Validation"
  /api/v1/admin/brands/{id}/state:
    patch:
      summary: Change brand state
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateInput"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/admin/brands/{brand_id}/products:
    get:
      summary: List products of a brand
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a product
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/BrandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Validation"
  /api/v1/admin/products/{id}:
    get:
      summary: Show a product
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a product
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      summary: Delete a product
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/admin/products/{id}/state:
    patch:
      summary: Change product state
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/client/reports:
    get:
      summary: Report the client's own spending
      tags: [Client]
      security:
        - bearer: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Totals for the authenticated client in the date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendingReport"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/client/cards:
    post:
      summary: Issue a card
      tags: [Client]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, activation_number]
              properties:
                product_id:
                  type: integer
                  example: 1
                activation_number:
                  type: string
                  pattern: "^\\d{16}$"
                  example: "0000000000000099"
      responses:
        "201":
          description: Issued card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "200":
          description: Same activation number and product returns the existing card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Activation number is already used
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Activation number is already used
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/client/cards/cancel:
    post:
      summary: Cancel an issued card
      tags: [Client]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activation_number]
              properties:
                activation_number:
                  type: string
                  pattern: "^\\d{16}$"
                  example: "0000000000000099"
      responses:
        "200":
          description: Cancelled card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          description: Card already cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Card already cancelled
  /api/v1/admin/reports/brands:
    get:
      summary: Report totals by brand
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Totals per brand in the date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandReport"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/reports/clients:
    get:
      summary: Report totals by client
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Totals per client in the date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientReport"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/audit_logs:
    get:
      summary: List audit logs
      tags: [Admin]
      security:
        - bearer: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
        - name: record_type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Audit logs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    BrandId:
      name: brand_id
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Validation:
      description: Validation errors
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
  schemas:
    Login:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            role:
              type: string
              enum: [admin, client]
            state:
              type: string
            payout_rate:
              type: number
              nullable: true
    Client:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
        state:
          type: string
        payout_rate:
          type: number
    CustomField:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    Brand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
          enum: [active, inactive]
        custom_fields:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CustomField"
    BrandInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        custom_fields:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CustomField"
    Product:
      type: object
      properties:
        id:
          type: integer
        brand_id:
          type: integer
        name:
          type: string
        price_value:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [active, inactive]
        custom_fields:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CustomField"
    ProductInput:
      type: object
      required: [name, price_value]
      properties:
        name:
          type: string
        price_value:
          type: integer
          minimum: 1
        custom_fields:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CustomField"
    Card:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        product_id:
          type: integer
        activation_number:
          type: string
          example: "0000000000000099"
        status:
          type: string
          enum: [issued, cancelled]
        price_value:
          type: integer
        payout_rate:
          type: string
          example: "12.5"
        issued_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        action:
          type: string
        auditable_type:
          type: string
          nullable: true
        auditable_id:
          type: integer
          nullable: true
        before_values:
          type: object
          nullable: true
          additionalProperties: true
        after_values:
          type: object
          nullable: true
          additionalProperties: true
        outcome:
          type: string
          enum: [success, refused]
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    BrandReport:
      type: object
      required: [brand_id, name, issued_count, issued_total_value, payout_total_value, cancelled_count, cancelled_total_value]
      properties:
        brand_id:
          type: integer
        name:
          type: string
        issued_count:
          type: integer
        issued_total_value:
          type: integer
        payout_total_value:
          type: number
        cancelled_count:
          type: integer
        cancelled_total_value:
          type: integer
    SpendingReport:
      type: object
      required: [issued_count, issued_total_value, payout_total_value, cancelled_count, cancelled_total_value]
      properties:
        issued_count:
          type: integer
        issued_total_value:
          type: integer
        payout_total_value:
          type: number
        cancelled_count:
          type: integer
        cancelled_total_value:
          type: integer
    ClientReport:
      type: object
      required: [client_id, email, issued_count, issued_total_value, payout_total_value, cancelled_count, cancelled_total_value]
      properties:
        client_id:
          type: integer
        email:
          type: string
        issued_count:
          type: integer
        issued_total_value:
          type: integer
        payout_total_value:
          type: number
        cancelled_count:
          type: integer
        cancelled_total_value:
          type: integer
    AuditLogPage:
      type: object
      required: [audit_logs, page, per_page, total]
      properties:
        audit_logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    StateInput:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [active, inactive]
