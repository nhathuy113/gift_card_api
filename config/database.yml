default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: gift_card_api_development

test:
  <<: *default
  database: gift_card_api_test

production:
  <<: *default
  database: gift_card_api_production
  username: gift_card_api
  password: <%= ENV["GIFT_CARD_API_DATABASE_PASSWORD"] %>
