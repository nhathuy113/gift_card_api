default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_DEVELOPMENT", "gift_card_api_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "gift_card_api_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_PRODUCTION", "gift_card_api_production") %>
  username: <%= ENV.fetch("DB_USERNAME", "gift_card_api") %>
  password: <%= ENV.fetch("GIFT_CARD_API_DATABASE_PASSWORD", ENV["DB_PASSWORD"]) %>
